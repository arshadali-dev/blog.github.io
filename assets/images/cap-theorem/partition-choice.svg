<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
  <title id="title">A partition forces a choice for London's read</title>
  <desc id="desc">Both replicas initially store inventory one. Communication breaks. Seattle completes a write to zero. A later London read can return its stale one, giving up linearizability, or wait or reject because it cannot coordinate, giving up availability for that read.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526987" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px;fill:#425570}.flow{fill:none;stroke:#526987;stroke-width:3;marker-end:url(#arrow)}.box{stroke:#cbd6e5;stroke-width:2}</style>
  <rect width="900" height="780" rx="18" fill="#f7f9fd"/>
  <text class="heading" x="40" y="52">What should the disconnected reader see?</text>
  <text class="body" x="40" y="90">A read/write example, not a fixed label for the whole product.</text>
  <rect class="box" x="40" y="125" width="350" height="100" rx="14" fill="#eef2ff"/>
  <text class="label" x="64" y="166">Seattle</text><text class="body" x="64" y="202">Initially: inventory = 1</text>
  <rect class="box" x="510" y="125" width="350" height="100" rx="14" fill="#e8f5f2"/>
  <text class="label" x="534" y="166">London</text><text class="body" x="534" y="202">Initially: inventory = 1</text>
  <path d="M402 175H498" stroke="#526987" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M438 159L462 191M462 159L438 191" stroke="#b54736" stroke-width="4"/>
  <text class="label" x="40" y="270">1. The link fails. The replicas cannot coordinate.</text>
  <rect class="box" x="40" y="300" width="350" height="132" rx="14" fill="#eef2ff"/>
  <text class="label" x="64" y="338">2. Write completes</text>
  <text class="body" x="64" y="376">Seattle saves inventory = 0.</text>
  <text class="body" x="64" y="410">Acknowledgment is returned.</text>
  <rect class="box" x="510" y="300" width="350" height="132" rx="14" fill="#e8f5f2"/>
  <text class="label" x="534" y="338">3. A later read arrives</text>
  <text class="body" x="534" y="376">London still has inventory = 1.</text>
  <text class="body" x="534" y="410">The write is not visible here.</text>
  <path d="M450 300V432" stroke="#b54736" stroke-width="3" stroke-dasharray="8 8"/>
  <path class="flow" d="M685 432V472H230V510"/>
  <path class="flow" d="M685 472V510"/>
  <rect class="box" x="40" y="525" width="395" height="172" rx="14" fill="#fff1e6"/>
  <text class="label" x="64" y="566">Preserve linearizability</text>
  <text class="body" x="64" y="606">Wait, or reject the read.</text>
  <text class="body" x="64" y="642">If coordination cannot resume,</text>
  <text class="body" x="64" y="676">this read is not available.</text>
  <rect class="box" x="465" y="525" width="395" height="172" rx="14" fill="#e8f5f2"/>
  <text class="label" x="489" y="566">Preserve read availability</text>
  <text class="body" x="489" y="606">Return London's stale value: 1.</text>
  <text class="body" x="489" y="642">This read no longer satisfies</text>
  <text class="body" x="489" y="676">linearizability.</text>
  <text class="body" x="40" y="745">A healthy node's error response is not a completed data read.</text>
</svg>
