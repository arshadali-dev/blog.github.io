<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Global checkout separates traffic routing from data authority</title>
  <desc id="desc">A customer reaches global routing and a CDN, then regional load balancers and applications in either region. Both application tiers depend on the same logical inventory and order authority and payment API. The authority is a replicated shard group placed according to its quorum and durability policy. Its order transaction includes an outbox; a relay publishes asynchronously to a queue and workers. Routing to a healthy region is insufficient if data authority is unavailable.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526987" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px;fill:#425570}.flow{fill:none;stroke:#526987;stroke-width:3;marker-end:url(#arrow)}.async{stroke-dasharray:8 6}.box{stroke:#cbd6e5;stroke-width:2}</style>
  <rect width="900" height="1080" rx="18" fill="#f7f9fd"/>
  <text class="heading" x="40" y="52">A healthy region still needs valid data authority</text>
  <text class="body" x="40" y="90">Illustrative logical dependencies, not a vendor implementation.</text>
  <rect class="box" x="325" y="120" width="250" height="60" rx="12" fill="#fff"/>
  <text class="label" x="390" y="158">Customer</text>
  <path class="flow" d="M450 180V210"/>
  <rect class="box" x="180" y="224" width="540" height="70" rx="12" fill="#eef2ff"/>
  <text class="label" x="272" y="266">Global routing / CDN</text>
  <path class="flow" d="M320 294V324H240V350"/>
  <path class="flow" d="M580 294V324H665V350"/>
  <rect class="box" x="40" y="365" width="395" height="166" rx="14" fill="#eef2ff"/>
  <text class="label" x="64" y="404">Region A</text>
  <text class="body" x="64" y="442">Regional load balancer</text>
  <text class="body" x="64" y="475">Application instances</text>
  <text class="body" x="64" y="508">Catalog cache: browsing only</text>
  <rect class="box" x="465" y="365" width="395" height="166" rx="14" fill="#e8f5f2"/>
  <text class="label" x="489" y="404">Region B</text>
  <text class="body" x="489" y="442">Regional load balancer</text>
  <text class="body" x="489" y="475">Application instances</text>
  <text class="body" x="489" y="508">Catalog cache: browsing only</text>
  <path d="M240 531V568H825M665 531V568" fill="none" stroke="#526987" stroke-width="3"/>
  <path class="flow" d="M400 568V628"/><path class="flow" d="M825 568V628"/>
  <text class="body" x="55" y="605">Reserve / commit</text>
  <text class="body" x="558" y="605">Idempotent charge</text>
  <rect class="box" x="40" y="643" width="480" height="189" rx="14" fill="#eef2ff"/>
  <text class="label" x="64" y="682">Inventory / order authority</text>
  <text class="body" x="64" y="720">Replicated shard group</text>
  <text class="body" x="64" y="754">Placement follows quorum / durability.</text>
  <text class="body" x="64" y="788">Order + outbox: one local transaction</text>
  <rect class="box" x="560" y="643" width="300" height="189" rx="14" fill="#fff1e6"/>
  <text class="label" x="584" y="682">Payment API</text>
  <text class="body" x="584" y="720">Same logical ID on retries</text>
  <text class="body" x="584" y="754">Unknown outcome?</text>
  <text class="body" x="584" y="788">Query and reconcile.</text>
  <path class="flow async" d="M260 832V884"/>
  <text class="body" x="288" y="869">Outbox relay publishes after commit</text>
  <rect class="box" x="40" y="899" width="300" height="68" rx="12" fill="#e8f5f2"/>
  <text class="label" x="138" y="941">Queue</text>
  <path class="flow async" d="M340 933H455"/>
  <rect class="box" x="470" y="899" width="390" height="68" rx="12" fill="#e8f5f2"/>
  <text class="body" x="492" y="941">Notification / fulfillment workers</text>
  <path d="M40 1012H98" stroke="#526987" stroke-width="3"/>
  <text class="body" x="113" y="1019">Request dependency</text>
  <path d="M440 1012H498" stroke="#526987" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="body" x="513" y="1019">Asynchronous work</text>
  <text class="body" x="40" y="1054">Cache freshness, write commitment, and payment success are distinct.</text>
</svg>
