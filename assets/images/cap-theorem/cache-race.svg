<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
  <title id="title">A cache-aside invalidation race</title>
  <desc id="desc">A reader misses the cache and reads the old inventory value one. Before that reader fills the cache, a writer commits zero to the database and invalidates the cache. The earlier reader then fills the cache with one. The database is current but the cache is stale; checkout must still reserve inventory atomically at the authority.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526987" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px;fill:#425570}.step{font-size:23px;font-weight:700;fill:#fff}.flow{fill:none;stroke:#526987;stroke-width:3;marker-end:url(#arrow)}.box{stroke:#cbd6e5;stroke-width:2}</style>
  <rect width="900" height="780" rx="18" fill="#f7f9fd"/>
  <text class="heading" x="40" y="52">Write, then invalidate: still not race-free</text>
  <text class="body" x="40" y="90">A delayed reader can repopulate the cache with an old value.</text>
  <path class="flow" d="M77 166V595"/>
  <rect class="box" x="120" y="128" width="740" height="100" rx="14" fill="#eef2ff"/>
  <circle cx="77" cy="176" r="25" fill="#3559bc"/><text class="step" x="70" y="184">1</text>
  <text class="label" x="146" y="165">Reader: cache miss</text>
  <text class="body" x="146" y="201">Reads inventory = 1 from the database; cache fill is delayed.</text>
  <rect class="box" x="120" y="255" width="740" height="100" rx="14" fill="#e8f5f2"/>
  <circle cx="77" cy="303" r="25" fill="#087f80"/><text class="step" x="70" y="311">2</text>
  <text class="label" x="146" y="292">Writer: commit the update</text>
  <text class="body" x="146" y="328">Database inventory becomes 0.</text>
  <rect class="box" x="120" y="382" width="740" height="100" rx="14" fill="#e8f5f2"/>
  <circle cx="77" cy="430" r="25" fill="#087f80"/><text class="step" x="70" y="438">3</text>
  <text class="label" x="146" y="419">Writer: invalidate the cache</text>
  <text class="body" x="146" y="455">The entry is removed, but the earlier reader is still running.</text>
  <rect class="box" x="120" y="509" width="740" height="100" rx="14" fill="#fff1e6"/>
  <circle cx="77" cy="557" r="25" fill="#a65025"/><text class="step" x="70" y="565">4</text>
  <text class="label" x="146" y="546">Reader: finish the delayed cache fill</text>
  <text class="body" x="146" y="582">Cache inventory becomes 1 again. The database remains 0.</text>
  <rect class="box" x="40" y="652" width="820" height="92" rx="14" fill="#fff"/>
  <text class="label" x="64" y="690">Protect the customer-facing operation</text>
  <text class="body" x="64" y="724">Define freshness controls; reserve inventory at the authority.</text>
</svg>
