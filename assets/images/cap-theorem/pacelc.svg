<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
  <title id="title">PACELC covers failure-time and everyday trade-offs</title>
  <desc id="desc">If replicas are partitioned, evaluate availability versus consistency. Otherwise, evaluate latency versus consistency. A Singapore profile update replicated asynchronously can be fast locally but stale in London. Global linearizability requires coordination somewhere in the read/write path, not necessarily every replica on every write.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526987" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px;fill:#425570}.flow{fill:none;stroke:#526987;stroke-width:3;marker-end:url(#arrow)}.box{stroke:#cbd6e5;stroke-width:2}</style>
  <rect width="900" height="690" rx="18" fill="#f7f9fd"/>
  <text class="heading" x="40" y="52">Two questions, not just one failure scenario</text>
  <text class="body" x="40" y="90">PACELC extends the discussion to normal-operation latency.</text>
  <rect class="box" x="230" y="126" width="440" height="80" rx="14" fill="#eef2ff"/>
  <text class="label" x="272" y="175">Can the replicas coordinate?</text>
  <path class="flow" d="M330 206V240H235V295"/>
  <path class="flow" d="M570 206V240H665V295"/>
  <text class="body" x="66" y="267">Partition</text><text class="body" x="710" y="267">Healthy</text>
  <rect class="box" x="40" y="310" width="395" height="194" rx="14" fill="#fff1e6"/>
  <text class="label" x="64" y="350">P: Availability or consistency</text>
  <text class="body" x="64" y="392">Complete the operation with</text>
  <text class="body" x="64" y="424">weaker consistency, or restrict</text>
  <text class="body" x="64" y="456">it when safe coordination</text>
  <text class="body" x="64" y="488">is not possible.</text>
  <rect class="box" x="465" y="310" width="395" height="194" rx="14" fill="#e8f5f2"/>
  <text class="label" x="489" y="350">E: Latency or consistency</text>
  <text class="body" x="489" y="392">Serve locally with weaker</text>
  <text class="body" x="489" y="424">visibility, or coordinate in the</text>
  <text class="body" x="489" y="456">read/write path for stronger</text>
  <text class="body" x="489" y="488">consistency guarantees.</text>
  <rect class="box" x="40" y="540" width="820" height="112" rx="14" fill="#ffffff"/>
  <text class="label" x="64" y="578">Example: a profile update in Singapore</text>
  <text class="body" x="64" y="612">A local acknowledgment can precede visibility in London.</text>
  <text class="body" x="64" y="642">Choose the contract per operation, configuration, and topology.</text>
</svg>
