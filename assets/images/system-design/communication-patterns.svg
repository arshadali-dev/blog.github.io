<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Four communication patterns and their different jobs</title>
  <desc id="desc">REST requests resources, GraphQL requests selected fields, WebSockets exchange bidirectional session events, and webhooks send server-to-server notifications. Each still needs authorization and explicit retry or delivery semantics.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526987" stroke-width="1.7"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px;fill:#425570}.small{font-size:18px;fill:#425570}.flow{fill:none;stroke:#526987;stroke-width:3;marker-end:url(#arrow)}.card rect{stroke:#c8d6e8;stroke-width:2}</style>
  <rect width="900" height="900" rx="18" fill="#f7f9fd"/>
  <text class="heading" x="40" y="52">Choose the interaction, not a universal winner</text>
  <text class="body" x="40" y="86">A product can use all four patterns for different workflows.</text>
  <rect x="40" y="110" width="820" height="165" rx="14" fill="#eef2ff"/>
  <text class="label" x="60" y="145">REST: resource request and response</text>
  <g class="card"><rect x="65" y="166" width="170" height="80" rx="10" fill="#fff"/><text class="label" x="88" y="214">Client</text></g>
  <g class="card"><rect x="630" y="166" width="205" height="80" rx="10" fill="#fff"/><text class="label" x="653" y="214">Resource API</text></g>
  <path class="flow" d="M247 190H618"/><text class="small" x="333" y="180">GET /events</text>
  <path class="flow" d="M618 231H247"/><text class="small" x="315" y="222">HTTP status + representation</text>
  <rect x="40" y="300" width="820" height="165" rx="14" fill="#e8f5f2"/>
  <text class="label" x="60" y="335">GraphQL: request a selection of fields</text>
  <g class="card"><rect x="65" y="356" width="170" height="80" rx="10" fill="#fff"/><text class="label" x="88" y="404">Client</text></g>
  <g class="card"><rect x="630" y="356" width="205" height="80" rx="10" fill="#fff"/><text class="label" x="653" y="404">GraphQL API</text></g>
  <path class="flow" d="M247 380H618"/><text class="small" x="280" y="370">Query: title, attendees, permission</text>
  <path class="flow" d="M618 421H247"/><text class="small" x="330" y="412">Selected response fields</text>
  <rect x="40" y="490" width="820" height="165" rx="14" fill="#eef2ff"/>
  <text class="label" x="60" y="525">WebSocket: ongoing bidirectional events</text>
  <g class="card"><rect x="65" y="546" width="170" height="80" rx="10" fill="#fff"/><text class="label" x="88" y="594">Client</text></g>
  <g class="card"><rect x="630" y="546" width="205" height="80" rx="10" fill="#fff"/><text class="label" x="653" y="594">Gateway</text></g>
  <path class="flow" d="M247 580H618" marker-start="url(#arrow)"/><text class="small" x="289" y="570">Messages, typing, live updates</text>
  <text class="small" x="280" y="619">Persistent channel is not durable storage.</text>
  <rect x="40" y="680" width="820" height="165" rx="14" fill="#e8f5f2"/>
  <text class="label" x="60" y="715">Webhook: one backend notifies another</text>
  <g class="card"><rect x="65" y="736" width="170" height="80" rx="10" fill="#fff"/><text class="label" x="85" y="784">Service A</text></g>
  <g class="card"><rect x="630" y="736" width="205" height="80" rx="10" fill="#fff"/><text class="label" x="650" y="784">Service B</text></g>
  <path class="flow" d="M247 760H618"/><text class="small" x="291" y="750">POST callback after a change</text>
  <path class="flow" d="M618 801H247"/><text class="small" x="310" y="792">Acknowledge; retry if needed</text>
  <text class="small" x="40" y="879">Authentication, authorization, compatibility, and limits apply to every pattern.</text>
</svg>
